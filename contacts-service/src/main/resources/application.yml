server:
  port: 8081

spring:
  application:
    name: contacts-service
  datasource:
    # Defaults allow running from the IDE against the Postgres container (docker compose up postgres)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/contacts_db
    username: ${DB_USER:contacts}
    password: ${DB_PASSWORD:contacts}
  jpa:
    open-in-view: false          # avoid lazy-loading queries during view rendering
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
