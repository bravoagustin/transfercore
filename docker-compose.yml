name: transfercore

# Shared healthcheck for Spring Boot services (busybox wget is available in the alpine JRE image)
x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      CONTACTS_DB_PASSWORD: ${CONTACTS_DB_PASSWORD:-contacts}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts}
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  legacy-banking-simulator:
    build:
      context: .
      dockerfile: legacy-banking-simulator/Dockerfile
    ports:
      - "8084:8084"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]

  contacts-service:
    build:
      context: .
      dockerfile: contacts-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${CONTACTS_DB_PASSWORD:-contacts}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]

  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts}
      LEGACY_BANKING_URL: http://legacy-banking-simulator:8084/ws
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      legacy-banking-simulator:
        condition: service_healthy
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]

  transfers-service:
    build:
      context: .
      dockerfile: transfers-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers}
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      CONTACTS_SERVICE_URL: http://contacts-service:8081
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
      TRANSFERS_SERVICE_URL: http://transfers-service:8083
    ports:
      - "8080:8080"
    depends_on:
      contacts-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      transfers-service:
        condition: service_healthy
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]

volumes:
  postgres-data:
